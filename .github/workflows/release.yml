name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Build site package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm run build
          cd dist && zip -r "../workout-site-${TAG}.zip" .

      - name: Upload site package artifact
        uses: actions/upload-artifact@v4
        with:
          name: workout-site-${{ github.ref_name }}
          path: workout-site-${{ github.ref_name }}.zip
          retention-days: 90

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSET="workout-site-${TAG}.zip"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Releases may be immutable, in which case assets cannot be added or
            # replaced. Never fail the workflow for that: the package is always
            # available as a workflow artifact.
            gh release upload "$TAG" "$ASSET" --clobber \
              || echo "::warning::Could not upload $ASSET to existing release $TAG (the release may be immutable). The package is available as a workflow artifact."
          else
            gh release create "$TAG" "$ASSET" \
              --title "Release $TAG" \
              --notes "Static site package for release \`$TAG\`." \
              --verify-tag
          fi
