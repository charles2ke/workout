name: Build & Release Mobile Apps

# Triggers whenever a GitHub Release is published.
# Produces artifacts for every platform and attaches them to the release.
#
# Required secrets (configure in repo Settings → Secrets and variables → Actions):
#
#   Android signing (optional – unsigned debug APK is always produced):
#     ANDROID_KEYSTORE          Base64-encoded .jks / .keystore file
#     ANDROID_KEY_ALIAS         Key alias inside the keystore
#     ANDROID_KEYSTORE_PASSWORD Keystore password
#     ANDROID_KEY_PASSWORD      Key password
#
#   iOS / iPadOS / watchOS signing (optional – simulator build always runs):
#     APPLE_CERTIFICATE         Base64-encoded .p12 distribution certificate
#     APPLE_CERTIFICATE_PASSWORD Password for the .p12 file
#     APPLE_PROVISIONING_PROFILE Base64-encoded .mobileprovision (ad-hoc or App Store)
#
#   Garmin Connect IQ (entire job is skipped unless CIQ_SDK_URL is set):
#     CIQ_SDK_URL               Direct download URL for the Connect IQ Linux SDK zip
#                               (obtain from https://developer.garmin.com/connect-iq/sdk/)
#     GARMIN_DEV_KEY_B64        Base64-encoded Garmin developer key (.der)
#                               Generate once with: monkeyc -k developer_key.der
#                               Then: base64 -w0 developer_key.der

on:
  release:
    types: [published]

permissions:
  contents: write   # needed to upload release assets

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Android  (APK sideload + AAB for Play Store)  +  Android Auto
  # ────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android + Android Auto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Patch AndroidManifest for Android Auto
        run: node scripts/patch-android.mjs

      - name: Copy Android Auto resources
        run: |
          mkdir -p android/app/src/main/res/xml
          cp scripts/automotive_app_desc.xml android/app/src/main/res/xml/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK (always)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease --no-daemon
        continue-on-error: true

      - name: Sign release APK
        if: ${{ secrets.ANDROID_KEYSTORE != '' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APK with version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "workout-android-${TAG}.apk" || true
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "workout-android-auto-${TAG}.aab" 2>/dev/null || true

      - name: Upload Android artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workout-android-*.apk
            workout-android-auto-*.aab

  # ────────────────────────────────────────────────────────────────────────────
  # iOS + iPadOS  (same IPA covers both)  +  watchOS companion
  # ────────────────────────────────────────────────────────────────────────────
  build-ios-watchos:
    name: Build iOS + iPadOS + watchOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Add iOS platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Install CocoaPods dependencies
        run: cd ios/App && pod install

      - name: Build iOS + iPadOS (simulator – always succeeds)
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive signed iOS + iPadOS IPA
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "ci" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci" build.keychain
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath Workout.xcarchive \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath Workout.xcarchive \
            -exportPath export \
            -exportOptionsPlist ../../scripts/ExportOptions.plist

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate watchOS Xcode project
        run: cd watchos && xcodegen generate

      - name: Build watchOS app (simulator – always succeeds)
        run: |
          cd watchos
          xcodebuild \
            -project WorkoutWatch.xcodeproj \
            -scheme WorkoutWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Rename IPA with version
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          cp ios/App/export/*.ipa "workout-ios-ipados-${TAG}.ipa" || true

      - name: Upload iOS + iPadOS IPA to release
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: workout-ios-ipados-*.ipa

  # ────────────────────────────────────────────────────────────────────────────
  # Garmin Connect IQ  (skipped unless CIQ_SDK_URL secret is set)
  # ────────────────────────────────────────────────────────────────────────────
  build-garmin:
    name: Build Garmin Connect IQ
    runs-on: ubuntu-latest
    if: ${{ secrets.CIQ_SDK_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Connect IQ SDK
        run: |
          wget -q "${{ secrets.CIQ_SDK_URL }}" -O ciq-sdk.zip
          unzip -q ciq-sdk.zip -d "$HOME/ciq-sdk"
          chmod +x "$HOME/ciq-sdk/bin/monkeyc"
          echo "$HOME/ciq-sdk/bin" >> "$GITHUB_PATH"

      - name: Set up developer key
        run: |
          if [ -n "${{ secrets.GARMIN_DEV_KEY_B64 }}" ]; then
            echo "${{ secrets.GARMIN_DEV_KEY_B64 }}" | base64 --decode > developer_key.der
          else
            # Temporary key for CI smoke-build (apps won't be distributable)
            openssl genrsa -out developer_key.pem 4096 2>/dev/null
            openssl pkcs8 -topk8 -inform PEM -outform DER \
              -in developer_key.pem -out developer_key.der -nocrypt
          fi

      - name: Build Garmin app for all supported devices
        run: |
          TAG="${{ github.event.release.tag_name }}"
          mkdir -p garmin-builds
          for device in fenix7 forerunner955 venu2 vivoactive4 epix2; do
            echo "▶ Building for $device…"
            monkeyc \
              -f garmin/monkey.jungle \
              -o "garmin-builds/workout-garmin-${device}-${TAG}.prg" \
              -y developer_key.der \
              -d "$device" && echo "  ✅ $device" || echo "  ⚠️ $device build failed"
          done

      - name: Upload Garmin .prg files to release
        if: ${{ secrets.GARMIN_DEV_KEY_B64 != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: garmin-builds/*.prg
