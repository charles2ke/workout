<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7-Day Longevity & Strength Program</title>
  <style>
    /* ===== Skip Link ===== */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 8px;
      z-index: 9999;
      padding: 8px 14px;
      background: var(--focus-ring);
      color: #0b1120;
      border-radius: 0 0 6px 6px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .skip-link:focus {
      top: 0;
    }

    /* ===== Screen-reader only ===== */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ===== Base / Theme ===== */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #7dd3fc;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --border-color: #475569;
      --focus-ring: #facc15;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100svh;
      padding: clamp(12px, 3vw, 20px);
    }

    .container { max-width: 960px; margin: 0 auto; }

    /* ===== Header ===== */
    header {
      text-align: center;
      padding-bottom: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 { font-size: clamp(1.4rem, 3vw, 1.9rem); color: #fff; margin-bottom: 6px; }
    .stats-bar { font-size: 0.95rem; color: var(--text-muted); }
    .stats-bar span { color: var(--accent); font-weight: 700; }

    .profile-summary {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .profile-field {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.88rem;
      white-space: nowrap;
    }

    .profile-field input,
    .profile-field select {
      width: 84px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      padding: 4px 6px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.88rem;
    }

    .profile-field select {
      width: 130px;
      cursor: pointer;
    }

    #name-input { width: 110px; }

    .profile-sep {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .profile-reset-btn {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.78rem;
      padding: 3px 8px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .profile-reset-btn:hover {
      background-color: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .profile-reset-btn:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* ===== Controls ===== */
    .controls-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .control-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
    }

    .control-card h2 {
      font-size: 1rem;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .toggle-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
    }

    .toggle-group label {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      cursor: pointer;
    }

    .timer-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .timer-controls input {
      width: 90px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      padding: 8px;
      background: #0b1120;
      color: var(--text-main);
    }

    .timer-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
      min-height: 1.2em;
    }

    .timer-status.done { color: var(--success); }
    .timer-status.error { color: var(--danger); }

    /* ===== Navigation Tabs ===== */
    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .tab-btn,
    .button {
      background-color: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      min-height: 44px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .tab-btn:hover,
    .tab-btn.active,
    .button:hover {
      background-color: var(--accent);
      color: #0b1120;
      border-color: var(--accent);
    }

    /* ===== Workout Sections ===== */
    .day-section { display: none; }
    .day-section.active { display: block; }

    .day-header { margin-bottom: 14px; }
    .day-title { font-size: 1.35rem; color: var(--accent); }
    .day-desc { color: var(--text-muted); font-size: 0.95rem; }
    .day-time { color: var(--text-main); font-size: 0.9rem; margin-top: 4px; }

    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .exercise-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
    }

    .svg-container {
      width: 100%;
      aspect-ratio: 5 / 3;
      background-color: #0b1120;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
    }

    .svg-container svg { width: 100%; height: 100%; }

    .exercise-info { padding: 14px; }
    .exercise-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
    .exercise-stats { font-size: 0.9rem; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
    .exercise-difficulty { font-size: 0.85rem; color: #fcd34d; margin-bottom: 6px; }
    .exercise-notes { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 10px; }

    .hidden-notes .exercise-notes,
    .hidden-difficulty .exercise-difficulty { display: none; }

    .copy-btn {
      width: 100%;
      font-size: 0.85rem;
      padding: 8px 10px;
    }

    /* ===== Accessibility / Focus ===== */
    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ===== Mobile ===== */
    @media (max-width: 640px) {
      .profile-summary {
        gap: 6px;
      }

      .profile-field {
        font-size: 0.84rem;
      }

      .profile-field input,
      .profile-field select {
        width: 76px;
      }

      #name-input { width: 96px; }

      .profile-sep { display: none; }

      .nav-tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
      }

      .tab-btn {
        width: 100%;
        justify-self: stretch;
      }

      .timer-controls input {
        width: 100%;
        flex: 1 1 100%;
      }
    }

    /* ===== Print ===== */
    @media print {
      :root {
        --bg-color: #ffffff;
        --card-bg: #ffffff;
        --text-main: #111827;
        --text-muted: #374151;
        --border-color: #9ca3af;
        --accent: #111827;
      }

      body {
        background: #fff;
        color: #111;
        padding: 0;
      }

      .controls-panel,
      .nav-tabs,
      .copy-btn {
        display: none !important;
      }

      .day-section {
        display: block !important;
        page-break-inside: avoid;
        margin-bottom: 14px;
      }

      .svg-container {
        background: #fff;
      }
    }
  </style>
</head>
<body>
  <a href="#workout-content" class="skip-link">Skip to main content</a>
  <div class="container">
    <header>
      <h1>7-Day Longevity & Strength Program</h1>
      <div class="stats-bar">
        <div class="profile-summary" aria-label="Editable profile summary">
          <label class="profile-field" for="name-input">Name <input id="name-input" type="text" value="Tito" autocomplete="name" aria-label="Name"></label>
          <span class="profile-sep" aria-hidden="true">|</span>
          <label class="profile-field" for="age-input">Age <input id="age-input" type="number" min="1" max="120" step="1" value="42" autocomplete="off" aria-label="Age in years"></label>
          <span class="profile-sep" aria-hidden="true">|</span>
          <label class="profile-field" for="ethnicity-input">Ethnicity
            <select id="ethnicity-input" aria-label="Ethnicity">
              <option value="Indian" selected>Indian</option>
              <option value="East Asian">East Asian</option>
              <option value="Southeast Asian">Southeast Asian</option>
              <option value="South Asian">South Asian</option>
              <option value="White / European">White / European</option>
              <option value="Black / African">Black / African</option>
              <option value="Hispanic / Latino">Hispanic / Latino</option>
              <option value="Middle Eastern">Middle Eastern</option>
              <option value="Native American">Native American</option>
              <option value="Pacific Islander">Pacific Islander</option>
              <option value="Mixed / Multiracial">Mixed / Multiracial</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <span class="profile-sep" aria-hidden="true">|</span>
          <label class="profile-field" for="height-input">Height <input id="height-input" type="text" value="5'11&quot;" autocomplete="off" aria-label="Height"></label>
          <span class="profile-sep" aria-hidden="true">|</span>
          <label class="profile-field" for="weight-input">Weight <input id="weight-input" type="number" min="1" max="500" step="0.1" value="77" autocomplete="off" aria-label="Weight in kilograms"></label>
          <span class="profile-sep" aria-hidden="true">|</span>
          <button type="button" id="reset-profile-btn" class="profile-reset-btn" aria-label="Reset profile to default values">Reset</button>
        </div>
      </div>
    </header>

    <section class="controls-panel" aria-label="Workout controls">
      <article class="control-card">
        <h2>Display Options</h2>
        <div class="toggle-group">
          <label><input type="checkbox" id="toggle-notes" checked aria-label="Show exercise notes"> Show notes</label>
          <label><input type="checkbox" id="toggle-difficulty" checked aria-label="Show exercise difficulty"> Show difficulty</label>
        </div>
      </article>

      <article class="control-card" aria-live="polite">
        <h2>Rest Timer</h2>
        <div class="timer-controls">
          <label for="rest-seconds">Seconds</label>
          <input id="rest-seconds" type="number" min="5" step="5" value="90" aria-label="Rest timer seconds">
          <button class="button" id="start-timer" type="button" aria-label="Start rest timer">Start</button>
          <button class="button" id="stop-timer" type="button" aria-label="Stop rest timer">Stop</button>
        </div>
        <p id="timer-display" role="timer" aria-live="polite" aria-describedby="timer-status">01:30</p>
        <p id="timer-status" class="timer-status">Ready.</p>
      </article>
    </section>

    <div id="copy-announcement" aria-live="polite" class="sr-only"></div>

    <nav class="nav-tabs" role="tablist" aria-label="Workout days" id="day-tabs"></nav>

    <main id="workout-content" aria-live="polite"></main>

    <footer>
      <p><strong>Golden Rule:</strong> Keep 1–2 reps in reserve on all compound lifts to protect joints and ensure consistent progress.</p>
    </footer>
  </div>

  <script src="workout.js"></script>
</body>
</html>
