<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="workout.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0f172a">
</head>
<body>
  <a href="#settings-content" class="skip-link">Skip to main content</a>
  <div class="container">
    <header>
      <h1>Settings</h1>
      <p class="page-subtitle">Choose what the workout program shows while you train.</p>
    </header>

    <nav class="page-nav" aria-label="Site pages">
      <a href="workout.html">Workout Program</a>
      <a href="fitness.html">My Fitness</a>
      <a href="settings.html" aria-current="page">Settings</a>
    </nav>

    <main id="settings-content">
      <section class="controls-panel" aria-label="Settings">
        <article class="control-card">
          <h2>Display Options</h2>
          <div class="toggle-group">
            <label><input type="checkbox" id="toggle-notes" checked aria-label="Show exercise notes"> Show notes</label>
            <label><input type="checkbox" id="toggle-difficulty" checked aria-label="Show exercise difficulty"> Show difficulty</label>
            <label><input type="checkbox" id="toggle-animation" checked aria-label="Animate exercise illustrations"> Animate exercises</label>
          </div>
          <p id="settings-status" class="timer-status" role="status">Saved automatically on this device.</p>
        </article>
      </section>
    </main>

    <footer>
      <p>Settings are stored in this browser only and apply to the workout program page.</p>
    </footer>
  </div>

  <script src="common.js"></script>
  <script src="settings.js"></script>
  <script src="sw-register.js"></script>
</body>
</html>
